apiVersion: v1
kind: Namespace
metadata:
  name: site-b
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: site-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
